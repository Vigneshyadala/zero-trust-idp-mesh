# Production override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires in .env: IDP_ADMIN_KEY, REDIS_PASSWORD, IDP_DOMAIN, ACME_EMAIL
services:
  app:
    environment:
      IDP_ISSUER: https://${IDP_DOMAIN:?set IDP_DOMAIN in .env}
      IDP_RP_ID: ${IDP_DOMAIN}
      IDP_RP_ORIGIN: https://${IDP_DOMAIN}

  traefik:
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/traefik/prod-routes.yml:/etc/traefik/dynamic/routes.yml:ro
      - letsencrypt:/letsencrypt

volumes:
  letsencrypt: