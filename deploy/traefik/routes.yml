http:
  routers:
    idp:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      service: idp
      middlewares:
        - security-headers
      tls: {}

  services:
    idp:
      loadBalancer:
        servers:
          - url: "http://app:8000"

  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "no-referrer"